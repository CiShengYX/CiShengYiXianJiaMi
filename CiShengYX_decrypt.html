<title>内容解密｜此生已陷</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#1a1025;--card:#251535;--accent:#ff6b9d;--accent2:#c084fc;--accent3:#67e8f9;
  --text:#f0e6ff;--text-dim:#9b8bb4;--success:#34d399;--error:#fb7185;--border:#3d2a54;
}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(circle at 20% 20%,rgba(255,107,157,.08) 0%,transparent 40%),
  radial-gradient(circle at 80% 80%,rgba(192,132,252,.08) 0%,transparent 40%),
  radial-gradient(circle at 50% 50%,rgba(103,232,249,.05) 0%,transparent 50%);
  z-index:0;animation:bgFloat 20s ease-in-out infinite}
@keyframes bgFloat{0%,100%{transform:translate(0,0)}33%{transform:translate(-2%,1%)}66%{transform:translate(1%,-1%)}}
.container{position:relative;z-index:1;max-width:800px;margin:0 auto;padding:30px 20px}
.author-section{text-align:center;padding:40px 20px 30px}
.avatar-wrapper{width:100px;height:100px;margin:0 auto 16px;border-radius:50%;overflow:hidden;
  border:3px solid var(--accent);box-shadow:0 0 20px rgba(255,107,157,.3),0 0 40px rgba(255,107,157,.1);
  animation:avatarGlow 3s ease-in-out infinite}
.avatar-wrapper img{width:100%;height:100%;object-fit:cover}
@keyframes avatarGlow{0%,100%{box-shadow:0 0 20px rgba(255,107,157,.3)}50%{box-shadow:0 0 25px rgba(192,132,252,.4)}}
.author-name{font-size:24px;font-weight:900;
  background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent3));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px}
.bilibili-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 20px;
  background:linear-gradient(135deg,#fb7299,#fc4c7a);color:#fff;text-decoration:none;
  border-radius:20px;font-size:14px;font-weight:500;transition:all .3s;box-shadow:0 4px 15px rgba(251,114,153,.3)}
.bilibili-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(251,114,153,.5)}
.bilibili-btn svg{width:18px;height:18px}
.title-section{text-align:center;margin:30px 0}
.title-section h1{font-size:28px;font-weight:900;position:relative;display:inline-block}
.title-section h1::after{content:'';position:absolute;bottom:-4px;left:10%;width:80%;height:3px;
  background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent3));border-radius:2px}
.title-section p{color:var(--text-dim);font-size:14px;margin-top:12px}
.drop-zone{border:2px dashed var(--border);border-radius:20px;padding:50px 30px;text-align:center;
  transition:all .3s;background:rgba(37,21,53,.6);backdrop-filter:blur(10px);position:relative;overflow:hidden}
.drop-zone::before{content:'';position:absolute;inset:0;border-radius:20px;
  background:linear-gradient(135deg,rgba(255,107,157,.05),rgba(192,132,252,.05));opacity:0;transition:opacity .3s}
.drop-zone:hover::before,.drop-zone.dragover::before{opacity:1}
.drop-zone.dragover{border-color:var(--accent);transform:scale(1.01);box-shadow:0 0 30px rgba(255,107,157,.2)}
.drop-icon{font-size:48px;margin-bottom:16px;display:block;animation:iconBounce 2s ease-in-out infinite}
@keyframes iconBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.drop-text{font-size:16px;font-weight:500;color:var(--text);margin-bottom:8px}
.drop-hint{font-size:13px;color:var(--text-dim)}
.file-input{display:none}
.btn-row{display:flex;gap:12px;margin-top:16px;justify-content:center;flex-wrap:wrap}
.btn-action{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;border:2px solid var(--border);
  border-radius:14px;background:rgba(37,21,53,.8);color:var(--text);font-size:14px;font-weight:600;
  font-family:inherit;cursor:pointer;transition:all .3s}
.btn-action:hover{border-color:var(--accent);background:rgba(255,107,157,.1);transform:translateY(-1px)}
.btn-action svg{width:16px;height:16px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(5px);z-index:100;justify-content:center;align-items:center}
.modal-overlay.active{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:30px;width:90%;max-width:400px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.5);animation:modalIn .3s ease-out}
@keyframes modalIn{from{transform:scale(.9) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.modal h3{font-size:18px;margin-bottom:20px;color:var(--accent)}
.modal input{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:12px;background:var(--bg);
  color:var(--text);font-size:16px;font-family:inherit;outline:none;transition:border-color .3s}
.modal input:focus{border-color:var(--accent)}
.modal-btns{display:flex;gap:12px;margin-top:20px}
.modal-btns button{flex:1;padding:10px;border:none;border-radius:12px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s}
.btn-confirm{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-confirm:hover{transform:translateY(-1px);box-shadow:0 4px 15px rgba(255,107,157,.4)}
.btn-cancel{background:var(--border);color:var(--text-dim)}
.btn-cancel:hover{background:#4a3660}
.results{margin-top:24px}
.result-item{background:rgba(37,21,53,.8);border:1px solid var(--border);border-radius:14px;padding:16px 20px;
  margin-bottom:12px;display:flex;align-items:center;gap:14px;animation:resultIn .4s ease-out}
@keyframes resultIn{from{transform:translateX(-20px);opacity:0}to{transform:translateX(0);opacity:1}}
.result-icon{font-size:28px;flex-shrink:0}
.result-info{flex:1;min-width:0}
.result-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-status{font-size:12px;margin-top:4px}
.result-status.success{color:var(--success)}.result-status.error{color:var(--error)}.result-status.loading{color:var(--accent3)}
.progress-bar{width:100%;height:4px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .3s;width:0%}
.stats-bar{display:none;margin-top:16px;padding:12px 20px;background:rgba(37,21,53,.8);border:1px solid var(--border);
  border-radius:14px;text-align:center;font-size:13px;color:var(--text-dim)}
.stats-bar.active{display:block}
.stats-bar span{color:var(--accent);font-weight:700}
.footer{text-align:center;margin-top:50px;padding:20px;color:var(--text-dim);font-size:12px;border-top:1px solid var(--border)}
.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}

<style id="cishengyx-sakura-theme">
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap');

:root{
  --paper:#fffdfd;
  --pink:#f06f9b;
  --pink-strong:#ec5f91;
  --pink-pale:#f7c6d5;
  --line:#f6dce5;
  --ink:#715f66;
  --muted:#9a828b;
  --success:#b94f76;
  --error:#c94864;
}

html{min-width:320px;min-height:100%;background:var(--paper);scroll-behavior:smooth}
body{margin:0;min-width:320px;min-height:100vh;background:var(--paper);color:var(--ink);font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{display:none!important}
button,input{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid rgb(240 111 155 / 24%);outline-offset:3px}

.site-shell{min-height:100svh;background:var(--paper)}
.site-header{height:128px;padding:0 64px 0 51px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f8dbe5;background:#fffdfd}
.brand,.bilibili-link{color:var(--pink);text-decoration:none;display:inline-flex;align-items:center}
.brand{gap:22px;font-family:'Noto Serif SC','Songti SC','STSong',serif;font-size:25px;font-weight:600;letter-spacing:.08em}
.brand img{width:64px;height:64px;display:block;object-fit:cover;border-radius:50%;box-shadow:0 0 0 1px rgb(240 111 155 / 34%)}
.bilibili-link{gap:10px;font-family:'Noto Serif SC','Songti SC','STSong',serif;font-size:20px;font-weight:500;letter-spacing:.03em;transition:color .18s ease,transform .18s ease}
.bilibili-link:hover{color:#d95784;transform:translateY(-1px)}
.bilibili-link i{font-size:28px}

.decrypt-layout{min-height:calc(100svh - 128px);display:grid;grid-template-columns:34.1% 65.9%}
.intro-panel{min-width:0;position:relative;overflow:hidden;border-right:1px solid #f5d8e2;background:#fffefe}
.petal-art{position:absolute;inset:0;pointer-events:none;user-select:none}
.petal{position:absolute;display:block;width:25px;height:auto;opacity:.78}
.petal-1{top:84px;left:30%;transform:rotate(-9deg)}
.petal-2{top:354px;left:79%;width:21px;transform:rotate(7deg)}
.petal-3{top:566px;left:31%;width:24px;transform:rotate(-22deg)}
.petal-4{top:694px;left:66%;width:23px;transform:rotate(8deg)}
.petal-5{top:813px;left:21%;width:24px;transform:rotate(-18deg)}
.intro-content{position:relative;z-index:1;margin:166px 40px 0 78px}
.intro-content h1{margin:0;color:#766269;font-family:'Noto Serif SC','Songti SC','STSong',serif;font-size:clamp(50px,4.25vw,66px);font-weight:500;line-height:1.16;letter-spacing:.045em;white-space:nowrap;display:inline-block;transform:scaleX(1.15);transform-origin:left center}
.intro-content h1 em{color:var(--pink);font-style:normal;margin-left:8px}
.local-note{margin:28px 0 0;color:#7f6971;font-family:'Noto Serif SC','Songti SC','STSong',serif;font-size:20px;font-weight:400;letter-spacing:.02em;line-height:1.7;white-space:nowrap;transform:scaleX(1.12);transform-origin:left center}
.local-note strong{color:var(--pink);font-weight:500}
.short-rule{display:block;width:44px;height:2px;margin:48px 0 43px;background:var(--pink)}
.privacy-copy{margin:0;color:#8d747e;font-family:'Noto Serif SC','Songti SC','STSong',serif;font-size:17px;line-height:2.5;letter-spacing:.035em}

.workspace-panel{min-width:0;padding:70px 75px 38px 68px;background:var(--paper)}
.drop-zone{height:340px;padding:0;border:1px dashed #f4b8ca;border-radius:20px;background:#fffefe;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#856d76;text-align:center;position:relative;overflow:hidden;transition:border-color .18s ease,background .18s ease,transform .18s ease}
.drop-zone::before{display:none!important}
.drop-zone.dragover{border-color:var(--pink);background:#fff7fa;transform:scale(.995);box-shadow:none}
.drop-zone.has-files{border-style:solid;border-color:#f5c1d1;background:#fffafb}
.drop-symbol{width:82px;height:82px;position:relative;display:grid;place-items:center;color:var(--pink)}
.drop-symbol .ph-folder-open{font-size:78px;font-weight:200}
.drop-symbol .drop-arrow{position:absolute;left:31px;top:35px;font-size:28px}
.drop-symbol .ph-check-circle{font-size:76px}
.drop-text{margin:28px 0 0;color:#806a72;font-family:'Noto Serif SC','Songti SC','STSong',serif;font-size:26px;font-weight:400;letter-spacing:.025em}
.drop-hint{margin:11px 0 0;color:#b18f9c;font-size:14px;opacity:0;transform:translateY(-4px);transition:opacity .18s ease,transform .18s ease}
.drop-zone:hover .drop-hint,.drop-zone.dragover .drop-hint,.drop-zone.has-files .drop-hint{opacity:1;transform:translateY(0)}
.or-divider{height:85px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:28px;color:var(--pink);font-family:'Noto Serif SC','Songti SC','STSong',serif;font-size:19px;font-weight:500}
.or-divider span{height:1px;background:#f3cad6}.or-divider b{font-weight:500}
.file-input{display:none!important}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin:0}
.btn-action{height:62px;padding:0 24px;border:1px solid #f2b9cb;border-radius:11px;background:#fffefe;color:#826b74;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:12px;font-family:'Noto Serif SC','Songti SC','STSong',serif;font-size:20px;font-weight:400;transition:background .16s ease,border-color .16s ease,color .16s ease}
.btn-action i{color:var(--pink);font-size:23px}
.btn-action:hover{color:#d95784;border-color:#eb91af;background:#fff8fa;transform:none}
.password-block{margin-top:39px}
.password-block label{display:block;margin-bottom:12px;color:var(--pink);font-family:'Noto Serif SC','Songti SC','STSong',serif;font-size:19px;font-weight:500;letter-spacing:.02em}
.password-field{height:64px;border:1px solid #f2c2d0;border-radius:11px;background:#fffefe;display:flex;align-items:center;transition:border-color .16s ease,box-shadow .16s ease}
.password-field:focus-within{border-color:#ec8eac;box-shadow:0 0 0 4px rgb(240 111 155 / 8%)}
.password-field input{width:100%;height:100%;padding:0 22px;border:0;outline:0;background:transparent;color:#725e66;font-size:18px}
.password-field input::placeholder{color:#c5afb7}
.icon-button{width:62px;height:100%;flex:0 0 auto;border:0;background:transparent;color:var(--pink);cursor:pointer;display:grid;place-items:center}
.icon-button i{font-size:25px}
.decrypt-button{width:100%;height:74px;margin-top:38px;border:0;border-radius:11px;color:#fff;background:#f2709a;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:14px;font-family:'Noto Serif SC','Songti SC','STSong',serif;font-size:27px;font-weight:500;letter-spacing:.035em;box-shadow:0 8px 22px rgb(223 95 139 / 12%);transition:background .16s ease,transform .16s ease}
.decrypt-button i{font-size:27px}.decrypt-button:hover:not(:disabled){background:#e86190;transform:translateY(-1px)}.decrypt-button:disabled{cursor:not-allowed;opacity:1;box-shadow:none}
.decrypt-button.is-working i{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.support-note{margin:31px 0 0;color:#8d747e;display:flex;align-items:center;justify-content:center;gap:12px;font-family:'Noto Serif SC','Songti SC','STSong',serif;font-size:16px;letter-spacing:.03em}.support-note i{color:var(--pink);font-size:24px}

.stats-bar{display:none;margin:28px 0 14px;padding:12px 18px;background:#fff8fa;border:1px solid #f4cfdb;border-radius:11px;text-align:center;font-size:13px;color:#9c7f89}.stats-bar.active{display:block}.stats-bar span{color:var(--pink-strong);font-weight:600}
.results{margin-top:20px}.result-item{background:#fffafa;border:1px solid #f2ccd8;border-radius:12px;padding:15px 18px;margin-bottom:12px;display:flex;align-items:center;gap:14px;animation:resultIn .25s ease-out;box-shadow:none}.result-icon{font-size:28px;color:var(--pink);flex-shrink:0}.result-info{flex:1;min-width:0}.result-name{font-size:14px;font-weight:500;color:#725e66;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.result-status{font-size:12px;margin-top:4px}.result-status.success{color:var(--success)}.result-status.error{color:var(--error)}.result-status.loading{color:var(--pink)}.progress-bar{width:100%;height:4px;background:#f6e0e7;border-radius:2px;margin-top:8px;overflow:hidden}.progress-fill{height:100%;background:var(--pink);border-radius:2px;transition:width .3s;width:0}
@keyframes resultIn{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}

.modal-overlay{display:none;position:fixed;inset:0;background:rgb(84 64 72 / 28%);backdrop-filter:blur(5px);z-index:100;justify-content:center;align-items:center}.modal-overlay.active{display:flex}.modal{background:#fffdfd;border:1px solid #f1c8d5;border-radius:18px;padding:28px;width:90%;max-width:400px;text-align:center;box-shadow:0 20px 60px rgb(111 77 91 / 18%)}.modal h3{font-family:'Noto Serif SC','Songti SC','STSong',serif;font-size:18px;margin-bottom:20px;color:var(--pink)}.modal input{width:100%;padding:12px 16px;border:1px solid #f2c2d0;border-radius:11px;background:#fff;color:#725e66;font-size:16px;outline:none}.modal input:focus{border-color:var(--pink)}.modal-btns{display:flex;gap:12px;margin-top:20px}.modal-btns button{flex:1;padding:10px;border:0;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer}.btn-confirm{background:var(--pink);color:#fff}.btn-cancel{background:#f8e9ee;color:#8f7680}

@media(max-width:1080px){.decrypt-layout{grid-template-columns:39% 61%}.site-header{padding-inline:36px}.intro-content{margin-left:42px}.intro-content h1{font-size:48px}.local-note{font-size:16px;white-space:normal}.privacy-copy{font-size:15px}.workspace-panel{padding-inline:44px}.btn-row{gap:20px}}
@media(max-width:760px){.site-header{height:82px;padding:0 20px}.brand{gap:12px;font-size:19px}.brand img{width:48px;height:48px}.bilibili-link{font-size:0;gap:0}.bilibili-link i{font-size:26px}.decrypt-layout{min-height:calc(100svh - 82px);display:block}.intro-panel{min-height:380px;border-right:0;border-bottom:1px solid #f5d8e2}.petal-1{top:34px;left:77%}.petal-2{top:184px;left:12%;width:19px}.petal-3{top:314px;left:82%;width:20px}.petal-4,.petal-5{display:none}.intro-content{margin:0;padding:68px 28px 48px}.intro-content h1{font-size:clamp(46px,14vw,58px);transform:none}.local-note{margin-top:18px;font-size:16px;transform:none}.short-rule{margin:30px 0 25px}.privacy-copy{font-size:14px;line-height:2.1}.workspace-panel{padding:34px 20px 36px}.drop-zone{height:230px;border-radius:16px}.drop-symbol{transform:scale(.78)}.drop-text{margin-top:18px;font-size:20px}.drop-hint{opacity:1}.or-divider{height:64px;gap:17px}.btn-row{gap:12px}.btn-action{height:54px;padding-inline:12px;gap:8px;font-size:16px}.password-block{margin-top:30px}.password-field{height:58px}.decrypt-button{height:62px;margin-top:26px;font-size:22px}.support-note{align-items:flex-start;font-size:13px;line-height:1.7;text-align:center}.stats-bar{margin-top:24px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

</style>

function formatBytes(bytes){
  if(bytes<1024)return bytes+' B';
  if(bytes<1024*1024)return(bytes/1024).toFixed(1)+' KB';
  return(bytes/1024/1024).toFixed(1)+' MB';
}

function stageFiles(files){
  selectedFiles=Array.from(files||[]).filter(Boolean);
  if(!selectedFiles.length){addResult('','ph-warning-circle','未检测到有效内容','error');return;}
  var totalSize=selectedFiles.reduce(function(sum,file){return sum+(file.size||0);},0);

  dropSymbol.innerHTML='<i class="ph ph-check-circle"></i>';
  dropText.textContent='已选择 '+selectedFiles.length+' 个文件';
  dropHint.textContent=selectedFiles[0].name+(selectedFiles.length>1?' 等 '+selectedFiles.length+' 项':'')+' · '+formatBytes(totalSize);
  resultsDiv.innerHTML='';
  statsBar.classList.remove('active');
  statsDone.textContent='0';statsTotal.textContent='0';
  currentPassword=null;
  startDecrypt.disabled=false;
  setWorking(false);
}

function setWorking(working){
  startDecrypt.classList.toggle('is-working',working);
  startDecrypt.disabled=working||selectedFiles.length===0;
  startIcon.className=working?'ph ph-spinner-gap':'ph ph-lock-key';

// Drag & Drop
// ============================
// Prevent browser from opening dropped files anywhere
document.addEventListener('dragover',function(e){e.preventDefault();},true);
// Note: removed global capture-phase drop listener to avoid interfering with dropZone data access

// dropZone: handle drag visual + drop processing
var isDraggingOver=false;
dropZone.addEventListener('dragenter',function(e){
  e.preventDefault();
  e.stopPropagation();
  if(!isDraggingOver){isDraggingOver=true;dropZone.classList.add('dragover');}
},false);
dropZone.addEventListener('dragover',function(e){
  e.preventDefault();
  e.stopPropagation();
  e.dataTransfer.dropEffect='copy';
},false);
dropZone.addEventListener('dragleave',function(e){
  e.preventDefault();
  e.stopPropagation();
  // Debounce to avoid flicker from child elements
  clearTimeout(dropZone._leaveTimer);
  dropZone._leaveTimer=setTimeout(function(){
    if(isDraggingOver){isDraggingOver=false;dropZone.classList.remove('dragover');}
  },100);
},false);
dropZone.addEventListener('drop',function(e){
  e.preventDefault();
  e.stopPropagation();
  isDraggingOver=false;
  dropZone.classList.remove('dragover');
  clearTimeout(dropZone._leaveTimer);

  var items=e.dataTransfer.items;
  var droppedFiles=e.dataTransfer.files;
  var hasDirectory=false;

  // Detect if any dropped item is a directory
  if(items&&items.length>0){
    for(var i=0;i<items.length;i++){
      try{
        var entry=items[i].webkitGetAsEntry?items[i].webkitGetAsEntry():null;
        if(entry&&entry.isDirectory){hasDirectory=true;break;}
      }catch(ex){}
    }
  }

  if(hasDirectory){
    // Folder: use File System Access API (dataTransfer.files doesn't include folder contents on Windows)
    var handles=[];
    if(items&&items.length>0){
      for(var i=0;i<items.length;i++){
        try{
          if(items[i].getAsFileSystemHandle){
            handles.push(items[i].getAsFileSystemHandle());
          }
        }catch(ex){}
      }
    }
    if(handles.length>0){
      Promise.all(handles).then(function(handles){
        var collected=[];
        var promises=handles.map(function(h){return collectFromHandle(h,collected);});
        Promise.all(promises).then(function(){
          if(collected.length>0)stageFiles(collected);
          else addResult('','ph-warning-circle','文件夹中没有找到有效文件','error');
        });
      });
    }else if(window.showDirectoryPicker){
      showDirectoryPicker().then(function(dirHandle){
        var collected=[];
        return collectFromHandle(dirHandle,collected).then(function(){return collected;});
      }).then(function(files){
        if(files.length>0)stageFiles(files);
        else addResult('','ph-warning-circle','选择的文件夹中没有找到有效文件','error');
      }).catch(function(err){
        if(err.name!=='AbortError')addResult('','ph-warning-circle','打开文件夹失败','error');
      });
    }else{
      addResult('','ph-warning-circle','当前浏览器不支持文件夹拖拽，请点击"选择文件夹"按钮','error');
    }
  }else{
    // Single or multiple files: use dataTransfer.files directly
    if(droppedFiles&&droppedFiles.length>0){
      var files=[];
      for(var i=0;i<droppedFiles.length;i++)files.push(droppedFiles[i]);
      stageFiles(files);
    }else{
      addResult('','ph-warning-circle','未检测到有效内容','error');
    }
  }
},false);

// ============================
// Collect files from FileSystemHandle (File System Access API)
// ============================
function collectFromHandle(handle,files){
  if(handle.kind==='file'){
    return handle.getFile().then(function(f){
      if(f)files.push(f);
    });
  }else if(handle.kind==='directory'){
    var promises=[];
    var iter=handle.values();
    function next(){
      return iter.next().then(function(r){
        if(r.done)return;
        promises.push(collectFromHandle(r.value,files));
        return next();
      });
    }
    return next().then(function(){return Promise.all(promises);});
  }
  return Promise.resolve();
}

// ============================
// Collect files from DataTransferItemList (folder support)
// ============================
function collectFromEntries(items){
  var files=[];
  var entries=[];
  for(var i=0;i<items.length;i++){
    var entry=items[i].webkitGetAsEntry();
    if(entry){entries.push(entry);}
    else{var f=items[i].getAsFile();if(f)files.push(f);}
  }
  var promises=entries.map(function(entry){return traverseEntry(entry,files);});
  return Promise.all(promises).then(function(){return files;});
}

function traverseEntry(entry,files){
  return new Promise(function(resolve){
    if(entry.isFile){
      entry.file(function(f){
        if(f){
          files.push(f);
          console.log("[traverse] file:",f.name,"size:",f.size);
        }else{
          console.log("[traverse] file entry but no file object:",entry.fullPath);
        }
        resolve();
      },function(err){
        console.error("[traverse] file error:",entry.fullPath,err);
        resolve();
      });
    }else if(entry.isDirectory){
      console.log("[traverse] dir:",entry.fullPath||entry.name);
      var reader=entry.createReader();
      readAllEntries(reader,function(childEntries){
        console.log("[traverse] dir "+(entry.fullPath||entry.name)+" has "+childEntries.length+" children");
        if(childEntries.length===0){resolve();return;}
        var childPromises=childEntries.map(function(e){return traverseEntry(e,files);});
        Promise.all(childPromises).then(function(){
          console.log("[traverse] dir "+(entry.fullPath||entry.name)+" done, files so far: "+files.length);
          resolve();
        });
      },function(err){
        console.error("[traverse] readAllEntries error:",err);
        resolve();
      });
    }else{
      console.log("[traverse] unknown type:",entry.name);
      resolve();
    }
  });
}

function readAllEntries(reader,callback,errCallback){
  var allEntries=[];
  var firstCall=true;
  function readBatch(){
    reader.readEntries(function(entries){
      if(!entries||entries.length===0){
        // Chrome bug: first call may return empty even when dir has files
        if(firstCall){
          firstCall=false;
          console.log("[readAllEntries] first batch empty, retrying...");
          setTimeout(readBatch,100);
          return;
        }
        console.log("[readAllEntries] done, total="+allEntries.length);
        callback(allEntries);return;
      }
      firstCall=false;
      allEntries=allEntries.concat(Array.from(entries));
      console.log("[readAllEntries] batch="+entries.length+" total="+allEntries.length);
      setTimeout(readBatch,0);
    },function(err){
      console.error("[readAllEntries] error:",err);
      if(errCallback)errCallback(err);
      else callback(allEntries);
    });
  }
  readBatch();
}

// ============================
// Process
// ============================
var pendingFiles=[];
var currentPassword=null;
var decryptedResults=[];
var totalCount=0,doneCount=0;

function equalMagic(data){
  if(data.length<8)return false;
  for(var i=0;i<8;i++)if(data[i]!==MAGIC[i])return false;
  return true;
}

function readU64(view,offset){
  var value=view.getBigUint64(offset,false);
  if(value>BigInt(Number.MAX_SAFE_INTEGER))throw new Error('文件长度超出浏览器可处理范围');
  return Number(value);
}

async function readBytes(file,start,length){
  if(start<0||length<0||start+length>file.size)throw new Error('文件已截断');
  return new Uint8Array(await file.slice(start,start+length).arrayBuffer());
}

async function findPngEnd(file){
  var signature=await readBytes(file,0,8);
  var expected=[137,80,78,71,13,10,26,10];
  for(var i=0;i<8;i++)if(signature[i]!==expected[i])throw new Error('不是有效的 PNG 文件');
  var pos=8;
  while(pos+12<=file.size){
    var chunkHead=await readBytes(file,pos,8);
    var view=new DataView(chunkHead.buffer,chunkHead.byteOffset,chunkHead.byteLength);
    var length=view.getUint32(0,false);
    var end=pos+12+length;
    if(end>file.size)throw new Error('PNG 数据不完整');
    if(chunkHead[4]===73&&chunkHead[5]===69&&chunkHead[6]===78&&chunkHead[7]===68){
      if(length!==0)throw new Error('PNG IEND 长度无效');
      return end;
    }
    pos=end;
  }
  throw new Error('PNG 缺少 IEND');
}

async function parseV1Header(file,packetOffset,initial){
  if(initial.length<57)initial=await readBytes(file,packetOffset,57);
  var filenameLen=(initial[55]<<8)|initial[56];
  var header=await readBytes(file,packetOffset,65+filenameLen);
  var filename=new TextDecoder().decode(header.slice(57,57+filenameLen));
  var dataLengthOffset=57+filenameLen;
  var view=new DataView(header.buffer,header.byteOffset,header.byteLength);
  var dataLen=readU64(view,dataLengthOffset);
  var cipherOffset=packetOffset+dataLengthOffset+8;
  if(cipherOffset+dataLen!==file.size)throw new Error('V1 密文长度不正确');
  return{
    version:VERSION_V1,contentType:header[9],hasPassword:header[10]===1,
    salt:header.slice(11,27),iv:header.slice(27,39),tag:header.slice(39,55),
    filename:filename,cipherOffset:cipherOffset,dataLen:dataLen
  };
}

async function parseChunkedHeader(file,packetOffset,version){
  var fixed=await readBytes(file,packetOffset,V2_FIXED_SIZE);
  var view=new DataView(fixed.buffer,fixed.byteOffset,fixed.byteLength);
  var contentType=fixed[9],flags=fixed[10],reserved=fixed[11];
  var chunkSize=view.getUint32(12,false),plainSize=readU64(view,16);
  var chunkCount=view.getUint32(24,false),metadataLen=view.getUint32(52,false);
  if(reserved!==0||(flags&~1)!==0)throw new Error('V2 文件头标志无效');
  if(chunkSize<65536||chunkSize>67108864)throw new Error('V2 分块大小无效');
  if(metadataLen>1048576)throw new Error('V2 元数据过大');
  var expectedCount=Math.max(1,Math.ceil(plainSize/chunkSize));
  if(chunkCount!==expectedCount)throw new Error('V2 分块数量无效');
  var header=await readBytes(file,packetOffset,V2_FIXED_SIZE+metadataLen);
  var metadata;
  try{metadata=JSON.parse(new TextDecoder().decode(header.slice(V2_FIXED_SIZE)));}
  catch(err){throw new Error('V2 元数据无效');}
  if(!metadata||typeof metadata!=='object'||Array.isArray(metadata)||metadata.size!==plainSize)throw new Error('V2 元数据长度不一致');
  var expectedFileSize=packetOffset+header.length+plainSize+chunkCount*(4+V2_TAG_SIZE);
  if(expectedFileSize!==file.size)throw new Error('V2 文件长度不正确或文件已截断');
  return{
    version:version,contentType:contentType,hasPassword:(flags&1)===1,
    chunkSize:chunkSize,plainSize:plainSize,chunkCount:chunkCount,
    salt:fixed.slice(28,44),noncePrefix:fixed.slice(44,52),metadata:metadata,
    filename:metadata.filename||'',mime:metadata.mime||'',header:header,
    dataOffset:packetOffset+header.length
  };
}

async function parseFile(file){
  var packetOffset=await findPngEnd(file);
  if(packetOffset+9>file.size)throw new Error('文件没有加密数据');
  var initial=await readBytes(file,packetOffset,Math.min(57,file.size-packetOffset));
  if(!equalMagic(initial))throw new Error('不是 CSYX 加密文件');
  var parsed;
  if(initial[8]===VERSION_V1)parsed=await parseV1Header(file,packetOffset,initial);
  else if(initial[8]===VERSION_V2||initial[8]===VERSION_V3)parsed=await parseChunkedHeader(file,packetOffset,initial[8]);
  else throw new Error('不支持的 CSYX 版本：'+initial[8]);
  return{file:file,packetOffset:packetOffset,parsed:parsed};
}

async function processFiles(files){
  if(!files.length)return;
  if(!window.crypto||!crypto.subtle){
    addResult('','ph-warning-circle','当前浏览器不支持 Web Crypto，无法安全解密','error');return;
  }
  var fileDataList=[];
  for(var i=0;i<files.length;i++){
    try{fileDataList.push(await parseFile(files[i]));}
    catch(err){addResult(files[i].name,'ph-warning-circle',err.message||'无法识别加密文件','error');}
  }
  if(fileDataList.length===0){addResult('','ph-warning-circle','未找到有效的加密文件','error');return;}
  totalCount=fileDataList.length;doneCount=0;
  statsBar.classList.add('active');
  statsTotal.textContent=totalCount;statsDone.textContent='0';
  var needsPassword=fileDataList.some(function(item){return item.parsed.hasPassword;});
  if(needsPassword&&currentPassword===null){pendingFiles=fileDataList;showPasswordModal();return;}
  await decryptAll(fileDataList,currentPassword||'');
}

async function decryptAll(fileDataList,password){
  decryptedResults=[];
  var totalEncrypted=fileDataList.reduce(function(sum,item){return sum+item.file.size;},0);
  var zipAvailable=typeof JSZip!=='undefined';
  var useZip=fileDataList.length>=ZIP_THRESHOLD&&totalEncrypted<=512*1024*1024&&zipAvailable;
  if(fileDataList.length>=ZIP_THRESHOLD&&!useZip){
    var reason=zipAvailable?'文件总体积较大，将逐个下载以降低内存占用':'ZIP 组件未加载，将逐个下载';
    addResult('批量下载','ph-info',reason,'success');
  }
  for(var index=0;index<fileDataList.length;index++){
    var result=await decryptFile(fileDataList[index],password,!useZip);
    if(useZip&&result)decryptedResults.push(result);
    doneCount++;statsDone.textContent=doneCount;
  }
  if(useZip&&decryptedResults.length>0)await downloadAsZip(decryptedResults);
  decryptedResults=[];
  currentPassword=null;
}

// ============================
// AES-256-GCM
// ============================
async function deriveV1Key(password,salt){
  var material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:100000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
}

async function deriveV2Key(password,salt){
  var pwd=new TextEncoder().encode(password||'CSYX_DEFAULT_KEY');
  var raw=new Uint8Array(V2_DOMAIN.length+salt.length+pwd.length);
  raw.set(V2_DOMAIN,0);raw.set(salt,V2_DOMAIN.length);raw.set(pwd,V2_DOMAIN.length+salt.length);
  var digest=await crypto.subtle.digest('SHA-256',raw);
  return crypto.subtle.importKey('raw',digest,{name:'AES-GCM'},false,['decrypt']);
}

async function deriveV3Key(password,salt){
  var pwd=new TextEncoder().encode(password||'CSYX_DEFAULT_KEY');
  var material=await crypto.subtle.importKey('raw',pwd,'PBKDF2',false,['deriveKey']);
  var domainSalt=concatBytes(V3_DOMAIN,salt);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:domainSalt,iterations:V3_PBKDF2_ITERATIONS,hash:'SHA-256'},
    material,{name:'AES-GCM',length:256},false,['decrypt']
  );
}

function concatBytes(a,b){
  var result=new Uint8Array(a.length+b.length);result.set(a,0);result.set(b,a.length);return result;
}

async function decryptV1(item,password,progressEl){
  var parsed=item.parsed;
  var ciphertext=await readBytes(item.file,parsed.cipherOffset,parsed.dataLen);
  var combined=concatBytes(ciphertext,parsed.tag);
  var pwd=parsed.hasPassword?password:'CSYX_DEFAULT_KEY';
  var key=await deriveV1Key(pwd,parsed.salt);
  var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:parsed.iv},key,combined);
  updateResult(progressEl,'正在完成旧版文件...','loading',95);
  return new Blob([plain],{type:CONTENT_MIME[parsed.contentType]||'application/octet-stream'});
}

async function decryptChunked(item,password,progressEl){
  var parsed=item.parsed;
  var key=parsed.version===VERSION_V3
    ?await deriveV3Key(parsed.hasPassword?password:'',parsed.salt)
    :await deriveV2Key(parsed.hasPassword?password:'',parsed.salt);
  var parts=[],position=parsed.dataOffset,decoded=0;
  for(var index=0;index<parsed.chunkCount;index++){
    var lengthBytes=await readBytes(item.file,position,4);position+=4;
    var lengthView=new DataView(lengthBytes.buffer,lengthBytes.byteOffset,4);
    var plainLength=lengthView.getUint32(0,false);
    var expected=Math.min(parsed.chunkSize,parsed.plainSize-decoded);
    if(parsed.plainSize===0)expected=0;
    if(plainLength!==expected)throw new Error('V2 加密块长度无效');
    var encrypted=await item.file.slice(position,position+plainLength+V2_TAG_SIZE).arrayBuffer();
    position+=plainLength+V2_TAG_SIZE;
    var nonce=new Uint8Array(12);nonce.set(parsed.noncePrefix,0);
    new DataView(nonce.buffer).setUint32(8,index,false);
    var indexBytes=new Uint8Array(4);new DataView(indexBytes.buffer).setUint32(0,index,false);
    var aad=concatBytes(parsed.header,indexBytes);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:nonce,additionalData:aad,tagLength:128},key,encrypted);
    parts.push(plain);decoded+=plain.byteLength;
    var progress=Math.max(1,Math.round((index+1)/parsed.chunkCount*98));
    updateResult(progressEl,'正在分块解密... '+progress+'%','loading',progress);
  }
  if(position!==item.file.size||decoded!==parsed.plainSize)throw new Error('V2 解密总长度不正确');
  return new Blob(parts,{type:parsed.mime||CONTENT_MIME[parsed.contentType]||'application/octet-stream'});
}

async function decryptFile(item,password,autoDownload){
  var parsed=item.parsed,file=item.file;
  var typeLabel=CONTENT_TYPES[parsed.contentType]||'未知';
  var icon=CONTENT_ICONS[parsed.contentType]||'ph-file';
  var el=addResult(file.name,icon,'正在解密 '+typeLabel+'...','loading',true);
  try{
    var decrypted=parsed.version===VERSION_V2||parsed.version===VERSION_V3
      ?await decryptChunked(item,password,el)
      :await decryptV1(item,password,el);
    var filename=safeFilename(parsed.filename||('decrypted'+(CONTENT_EXT[parsed.contentType]||'.bin')));
    var mime=parsed.mime||CONTENT_MIME[parsed.contentType]||'application/octet-stream';
    updateResult(el,typeLabel+' 解密成功！','success',100);
    if(autoDownload)downloadBlob(decrypted,filename,mime);
    return{data:decrypted,filename:filename,mime:mime};
  }catch(err){
    var msg='解密失败：'+(err.message||'未知错误');
    if(err.name==='OperationError')msg=parsed.hasPassword?'密码错误或文件已损坏':'文件已损坏';
    updateResult(el,msg,'error',0);
    return null;
  }
}

// ============================
// Download
// ============================
function safeFilename(filename){
  var value=String(filename||'decrypted.bin').replace(/[\\/:*?"<>|\u0000-\u001f]/g,'_').replace(/[. ]+$/,'');
  return value.slice(0,240)||'decrypted.bin';
}

function downloadBlob(data,filename,mime){
  var blob=data instanceof Blob?data:new Blob([data],{type:mime});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download=safeFilename(filename);
  document.body.appendChild(a);a.click();
  setTimeout(function(){a.remove();URL.revokeObjectURL(url);},5000);
}

async function downloadAsZip(results){
  var statusEl=addResult('批量下载','ph-file-zip','正在打包 '+results.length+' 个文件为 ZIP...','loading',true);
  try{
    if(typeof JSZip==='undefined')throw new Error('ZIP 组件加载失败，请检查网络后重试');
    var zip=new JSZip(),nameCount={};
    results.forEach(function(result){
      var name=safeFilename(result.filename);
      if(nameCount[name]){nameCount[name]++;name=name.replace(/(\.[^.]+)$/,'_'+nameCount[name]+'$1');}
      else nameCount[name]=1;
      zip.file(name,result.data);
    });
    var blob=await zip.generateAsync({type:'blob'});
    downloadBlob(blob,'decrypted_files.zip','application/zip');
    updateResult(statusEl,'ZIP 打包完成，已开始下载 ✓','success',100);
  }catch(err){updateResult(statusEl,'ZIP 打包失败: '+err.message,'error',0);}
}

// ============================
// UI
// ============================
function addResult(name,icon,status,cls,progress){
  var el=document.createElement('div');el.className='result-item';
  el.innerHTML='<i class="ph '+icon+' result-icon" aria-hidden="true"></i><div class="result-info"><div class="result-name">'+
    escapeHtml(name)+'</div><div class="result-status '+cls+'">'+status+'</div>'+
    (progress?'<div class="progress-bar"><div class="progress-fill"></div></div>':'')+'</div>';
  resultsDiv.prepend(el);return el;
}
function updateResult(el,status,cls,prog){
  var s=el.querySelector('.result-status');s.textContent=status;s.className='result-status '+cls;
  var f=el.querySelector('.progress-fill');if(f&&prog!==undefined)f.style.width=prog+'%';
}
function escapeHtml(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

// ============================
// Password Modal
// ============================
function showPasswordModal(){modal.classList.add('active');pwdInput.value='';setTimeout(function(){pwdInput.focus();},100);}
function hidePasswordModal(){modal.classList.remove('active');pwdInput.value='';}

document.getElementById('btnConfirm').addEventListener('click',function(){
  var pwd=pwdInput.value;hidePasswordModal();
  currentPassword=pwd;var files=pendingFiles;pendingFiles=[];
  decryptAll(files,pwd);
});
document.getElementById('btnCancel').addEventListener('click',function(){
  hidePasswordModal();pendingFiles=[];currentPassword=null;
});
pwdInput.addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('btnConfirm').click();});
modal.addEventListener('click',function(e){if(e.target===modal)document.getElementById('btnCancel').click();});
</script>
